apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-tester
  namespace: jammy
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-test-observer
  namespace: jammy
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-test-observer
  namespace: jammy
subjects:
  - kind: ServiceAccount
    name: backend-tester
    namespace: jammy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-test-observer

