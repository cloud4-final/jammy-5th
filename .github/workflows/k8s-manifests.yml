name: k8s-manifests
on:
  pull_request:
    paths:
      - 'k8s/**'
      - '.github/workflows/k8s-manifests.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s k8s/tests -v

