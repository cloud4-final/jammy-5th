# 본체(jammy-main) 공통 값. VM별 값은 vms/jammy-main/*.yml
expected_hostname: jammy-main

# /var/lib/libvirt 가 붙은 파티션 (설치 디스크 배치 기준)
vm_storage_device: /dev/nvme0n1p5

base_image: /var/lib/libvirt/images/noble-server-cloudimg-amd64.img
# 본체에서 `sudo sha256sum /var/lib/libvirt/images/noble-server-cloudimg-amd64.img` 값으로 바꾼다.
# 바꾸기 전에는 이미지 확인 단계에서 멈춘다.
base_image_sha256: "CHANGE_ME"

vm_disk_dir: /var/lib/libvirt/images
vm_seed_dir: /var/lib/libvirt/cloud-init

vm_user: jammy
vm_dns: 8.8.8.8
